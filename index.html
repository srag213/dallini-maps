<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دلّيني | خرائط العراق</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap"
rel="stylesheet">

<style>
*{box-sizing:border-box}
body{margin:0;background:#0e0d15;color:white;font-family:Tajawal,sans-serif}
#map{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.header{position:absolute;top:12px;right:15px;left:15px;z-index:500}
.logo{font-size:30px;font-weight:900;color:#bb78ff;margin:5px 8px 12px;text-shadow:0 0 15px #8b2be2}
.search{display:flex;gap:8px;align-items:center;background:#17151f;border:1px solid #a855f7;border-radius:20px;padding:10px;box-shadow:0 4px 18px #0005}
.search input{min-width:0;flex:1;background:transparent;border:0;outline:0;color:white;font:16px Tajawal}
button{font-family:inherit;cursor:pointer}
.search button{background:#922ce8;color:white;border:0;border-radius:13px;padding:12px 16px;font-weight:bold}
.cities{display:flex;gap:8px;overflow:auto;margin-top:12px;padding-bottom:5px}
.city{flex-shrink:0;background:#191622;color:white;border:1px solid #8e48c5;border-radius:25px;padding:10px 17px;font-size:15px;font-weight:bold}
.controls{position:absolute;z-index:500;left:15px;bottom:275px;display:grid;gap:10px}
.ctrl{width:52px;height:52px;border:1px solid #9142d0;border-radius:17px;background:#191622;color:white;font-size:25px;box-shadow:0 4px 14px #0005}
.purple{background:#9333ea}
.sheet{position:absolute;z-index:500;bottom:0;right:0;left:0;background:#111019;border-radius:28px 28px 0 0;padding:12px 18px 90px;border-top:1px solid #873fc0;box-shadow:0 -5px 25px #0004}
.handle{height:5px;width:45px;background:#6e637c;border-radius:10px;margin:0 auto 20px}
h2{font-size:25px;margin:0 0 20px}
.place{display:flex;align-items:center;gap:14px;background:#201c2b;border:1px solid #3a2b4b;border-radius:20px;padding:17px;margin-bottom:15px}
.pin{font-size:30px}
.place strong{font-size:19px}
.place small{display:block;color:#b5aabe;margin-top:6px;font-size:14px}
.locate{width:100%;background:linear-gradient(100deg,#a02cf0,#6726d7);color:white;border:0;border-radius:17px;padding:17px;font-size:19px;font-weight:900}
.nav{position:absolute;z-index:600;bottom:0;left:0;right:0;height:70px;background:#0c0b12;border-top:1px solid #302637;display:flex;justify-content:space-around;align-items:center}
.nav div{text-align:center;color:#aaa1b7;font-size:13px}
.nav b{display:block;font-size:23px;margin-bottom:2px}
.nav .active{color:#c084fc}
.leaflet-control-attribution{font-size:9px!important}
</style>
</head>

<body>

<div id="map"></div>

<div class="header">
  <div class="logo">📍 دلّيني</div>

  <div class="search">
    <input id="q" placeholder="ابحث عن مدينة أو مكان بالعراق">
    <button onclick="searchPlace()">بحث</button>
  </div>

  <div class="cities">
    <button class="city" onclick="city('بغداد',33.3152,44.3661)">بغداد</button>
    <button class="city" onclick="city('البصرة',30.5085,47.7804)">البصرة</button>
    <button class="city" onclick="city('أربيل',36.1901,44.0091)">أربيل</button>
    <button class="city" onclick="city('الموصل',36.3350,43.1189)">الموصل</button>
    <button class="city" onclick="city('النجف',32,44.335)">النجف</button>
    <button class="city" onclick="city('كربلاء',32.616,44.0249)">كربلاء</button>
  </div>
</div>

<div class="controls">
  <button class="ctrl purple" onclick="myLocation()">➤</button>
  <button class="ctrl" onclick="map.zoomIn()">＋</button>
  <button class="ctrl" onclick="map.zoomOut()">－</button>
</div>

<div class="sheet">
  <div class="handle"></div>
  <h2>وين تريد تروح؟</h2>

  <div class="place">
    <span class="pin">📍</span>
    <div>
      <strong id="placeName">بغداد، العراق</strong>
      <small>اختار وجهتك حتى تظهر على الخريطة</small>
    </div>
  </div>

  <button class="locate" onclick="myLocation()">📍 تحديد موقعي الحالي</button>
</div>

<div class="nav">
  <div><b>👤</b>حسابي</div>
  <div><b>🕘</b>الأخيرة</div>
  <div><b>⭐</b>المفضلة</div>
  <div class="active"><b>🗺️</b>الخريطة</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{zoomControl:false}).setView([33.3152,44.3661],12);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19,
  attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);

const marker=L.marker([33.3152,44.3661]).addTo(map);

function city(name,lat,lng){
  map.flyTo([lat,lng],14);
  marker.setLatLng([lat,lng]);
  document.getElementById('placeName').textContent=name+'، العراق';
}

async function searchPlace(){
  const q=document.getElementById('q').value.trim();
  if(!q){alert('اكتب اسم المكان أولاً');return}
  try{
    const url='https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=iq&q='+encodeURIComponent(q);
    const res=await fetch(url);
    const data=await res.json();
    if(!data.length){alert('ما لكيت المكان، جرّب اسم ثاني');return}
    const p=data[0],lat=+p.lat,lng=+p.lon;
    map.flyTo([lat,lng],15);
    marker.setLatLng([lat,lng]);
    document.getElementById('placeName').textContent=p.display_name.split(',').slice(0,2).join('،');
  }catch(e){alert('تعذر البحث، تأكد من الإنترنت')}
}

function myLocation(){
  if(!navigator.geolocation){alert('تحديد الموقع غير مدعوم');return}
  navigator.geolocation.getCurrentPosition(p=>{
    const lat=p.coords.latitude,lng=p.coords.longitude;
    map.flyTo([lat,lng],16);
    marker.setLatLng([lat,lng]);
    document.getElementById('placeName').textContent='موقعي الحالي';
  },()=>alert('فعّل إذن الموقع GPS'));
}
</script>

</body>
</html>
